# competition_mission parameters. Waypoints come from `waypoints_file` (laptop_mission.launch.py waypoints:=...),
# map frame, origin = start pose. Every unknown from the rulebook is here, marked PLACEHOLDER.
competition_mission:
  ros__parameters:
    auto_start: false          # false: wait for std_msgs/Empty on /mission/start (scripts/laptop/go.sh)
    mission_time_limit_s: 175.0   # hard global deadline; rulebook limit is 180 s
    finish_grace_s: 10.0       # extra time for the finish goal after the deadline
    goal_timeout_s: 30.0       # per Nav2 goal (a leg is ~10 s at 0.3 m/s; 45 s x 2 attempts nearly cost the deadline in the sim)
    max_retries: 1             # retries per goal after clearing costmaps, then skip the waypoint
    # classification
    classify_retries: 2        # extra /classify attempts (with a small yaw wiggle in between)
    classify_timeout_s: 8.0
    reposition_yaw_deg: 8.0
    default_class: plastic     # fallback when the classifier stays 'unknown'
    stub_class: ''             # set by laptop_mission classifier:=stub
    bay_plastic: blue          # class -> bin colour (rulebook)
    bay_organic: white
    bay_metal: black
    # loading
    loading_adapter: stub      # PLACEHOLDER: organisers' loading protocol unknown (see loading_adapters.py)
    load_wait_s: 6.0           # stub: wait this long, or until /loading/done
    # deposit
    has_drop_bin: false        # the drop bin is not mounted yet; true -> call drop_service at the bin
    drop_service: /dump
    drop_timeout_s: 8.0
    bin_pause_s: 2.0           # pause at the bin when has_drop_bin is false
    # gate (robot stands at gate_check facing the gate)
    gate_max_wait_s: 5.0       # PLACEHOLDER: rulebook "standard waiting time" not announced (gate seen opening ~2 s)
    gate_reserve_s: 55.0       # never wait at the gate into the last 55 s (path + deposit + finish); 0 s budget =
                               # take what is open NOW (open gate -> path2, else path1)
    deposit_reserve_s: 35.0    # any stage before DEPOSIT with less than this left -> skip ahead to deposit + finish
    gate_center_deg: 0.0       # sector centre in the laser frame, 0 = straight ahead
    gate_half_width_deg: 10.0
    gate_align_heading: false  # NEW, off: turn to the gate_check yaw first (Nav2 yaw tolerance 0.4 rad > the +-10 deg sector)
    gate_align_tol_deg: 4.0
    gate_open_threshold_m: 1.5 # median range above this = open. Course map: gate_check ~0.9 m from the closed gate,
                               # open lane ~3.7 m deep. PLACEHOLDER: re-check with the real gate
    gate_open_confirm_n: 3     # consecutive open polls needed
    gate_poll_hz: 5.0
    # obstacles
    obstacle_wait_s: 3.0       # stopped by the collision monitor this long -> cancel + re-send the goal (replan)
    max_replans: 2             # per goal, then it counts as a failure (retry/skip policy)
    # obstacle detection = lidar points not explained by the map frozen at the start, either in a cone ahead or
    # near the first metres of Nav2's plan (a worker blocking a corridor stops Nav2 metres away)
    obstacle_range_m: 1.0      # cone detector range
    obstacle_half_angle_deg: 35.0
    obstacle_min_points: 4
    obstacle_route_len_m: 2.5  # route detector: first metres of /plan ...
    obstacle_route_tol_m: 0.30 # ... points within this distance of it ...
    obstacle_route_max_range_m: 4.0   # ... and within this lidar range
    obstacle_max_wait_s: 10.0  # obstacle in view + no progress this long -> path1 if an alternative exists
                               # (to the junction/gate check, or on path2), otherwise keep waiting + re-checking
    obstacle_switch_path: true
    obstacle_min_move_m: 0.10
    obstacle_clear_s: 3.0      # no detection this long = the episode is over (next one is logged again)
    obstacle_confirm_scans: 2  # consecutive scans before an episode starts (sim: 1-scan flicker at walls/posts)
    # speeds
    mission_speed: 0.30        # Nav2 /speed_limit, m/s
    terrain_speed: 0.15
    terrain_surface: ''        # e.g. SAND, published on /surface_override during TERRAIN; '' = off
    ramp_dash: false           # NEW, off: the Pi's ramp_dash node climbs the dirt ramp (pi_bringup ramp_dash:=true)
    ramp_dash_after: terrain_3 # foot of the ramp, facing up the strip
    ramp_dash_skip: [terrain_4]
    ramp_dash_timeout_s: 30.0
    cmd_vel_topic: /cmd_vel
    log_dir: ~/logs
    collision_monitor: /collision_monitor   # switched from the mapping stop box to the mission one at start-up
    turn_calibration: false    # NEW (off): spin test right after the start (set by laptop_mission turn_calibration:=true)
    turn_calibration_timeout_s: 40.0
    start_nudge_m: 0.15        # creep forward before the first goal (back of the robot ~0.13 m from the start-box wall); 0 = off
    start_nudge_speed: 0.10
