# hardleel waste-sorting mission - SETTINGS (behaviour tree: hardleel_mission/mission_node.py)
# The PLACES (checkpoints) are not in this file: mark them with the robot standing on each spot,
#   ros2 run hardleel_mission mark camera | pickup_blue | pickup_green | pickup_red | blue | green | red | gate
# -> ~/.hardleel/mission_places.yaml   (ros2 run hardleel_mission mark --list  shows them)
#
# Order of one round: camera (AI picture -> colour) -> collect (servo grab) -> gate (wait until open)
#                     -> dump place of that colour (servo release)

auto_start: false        # false: wait for  ros2 topic pub --once /mission/start std_msgs/msg/Bool "{data: true}"
rounds: 1                # how many times to do the whole round
mission_max_s: 240       # time BUDGET for the whole mission (user: 4 min) - only a warning, the robot never stops at it
tick_hz: 10.0

nav_retries: 3           # attempts per drive (Nav2 goal) before giving up on it (24 Nov audit: was 2)
nav_retry_backoff_s: 2.5 # pause before a retry, so a short TF / Wi-Fi / scan stall passes (was 0: retried inside it)
nav_timeout_s: 90.0      # one drive longer than this = failed attempt. Was 45: the closed-gate ramp detour is ~10-11 m
                         # through 0.6-0.8 m corridors at 0.15-0.3 m/s. Nav2's progress checker still aborts a STUCK drive
classify_retries: 3      # camera attempts when it sees nothing / is unsure ("none", "unknown")
servo_wait_s: 1.0        # time the servo bed needs to move
pickup_wait_s: 5.0       # stay at the pickup spot this long while the item is loaded (user 24 Nov)
# pickup_* and drop-off places are where the DOCK centre (11 x 9.5 cm) must be. Dock centre = 16 cm ahead of the
# lidar, lidar 10 cm behind base_link -> 0.06 m ahead of base_link (+x forward, +y left)
dock_offset_x: 0.06
dock_offset_y: 0.0
min_battery_v: 6.8       # 2S pack: don't start a round below this (needs the Nano battery sensor)

colours: [blue, green, red]       # rule book 2026: plastic -> Blue, organic -> Green, metal -> Red (place name = colour)

# timed gate: robot stands at the "gate" place FACING the gate; lidar straight ahead decides
gate_open_m: 0.6         # free distance straight ahead that counts as open (closed gate = closer than this)
gate_half_angle_deg: 10  # width of the "straight ahead" lidar window (+- degrees)
gate_confirm_s: 0.5      # must stay open this long (ignores a flicker)
gate_max_wait_s: 10      # (user 24 Nov) then carry on to the drop-off anyway (Nav2 plans around the closed gate, ramp route)

# dry_run:=true only: simulated drive/gate time and camera answers (cycled; "none" tests the classify retry)
dry_run_nav_s: 2.0
dry_run_gate_s: 3.0
dry_run_colours: [blue, none, green, red]
dry_run_fail_nav: []     # drives that fail in the dry run, e.g. [gate] = gate place blocked (tests the skip)
